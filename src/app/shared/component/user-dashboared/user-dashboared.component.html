<div class="row">
    <div class="col-12 text-end mb-3">
        <button 
            routerLink="add"
            class="btn btn btn-sm btn-outline-primary">
            Add User
        </button>
    </div>
    <div class="col-md-4">
        <ul class="list-group">
            <li [routerLink]="['/user', user.id]"
                class="list-group-item"
                *ngFor="let user of usersArr">
                {{user.id}} {{user.name}} 
            </li>
        </ul>
    </div>
</div>
